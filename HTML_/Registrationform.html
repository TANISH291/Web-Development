<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <form action="">
            <h2>Registration Form</h2>
            <br>
            <label for="name">First Name:</label>
            <input type="text" name="Fname" id="fname" placeholder="First Name">
            <label for="lname">Last Name:</label>
            <input type="text" name="Lname" id="lname" placeholder="Last Name">
            <br>
            <br>
            <br>
            <label for="gender">Select your Gender:</label>
            <select name="gender" id="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Others">Others</option>
            </select>
            <br><br>
            Do you agree to all terms of service?
            <input type="checkbox" name="agree" id="yes" >
            <label for="yes">Yes, I agree</label>
            <br>
            <br>
            18+ age :  
            <label for="age">Yes</label>
            <input type="radio" name="age" id="age">
            <label for="age">No</label>
            <input type="radio" name="age" id="age">
            <br>
            <br>
            <label for="feedback">FEEDBACK==></label>
            <textarea name="feedback" id="feedback" placeholder="Your Feedback...." rows="5" cols="30"></textarea>
            <br>
            <br>
            <hr>
            <button>Register</button>

        </form>
    </div>
</body>
</html>
